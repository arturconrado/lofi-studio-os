name: Export worker capacity
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-export-capacity
  cancel-in-progress: false
jobs:
  capacity:
    # Never execute PR code with production credentials. Main must pass Checks.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Require the current main revision
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 -m py_compile ops/export-worker-capacity.py
      - name: Require successful Checks for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha || context.sha;
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'checks.yml', head_sha: sha, per_page: 100
            });
            if (!data.workflow_runs.some(run => run.head_sha === sha &&
                ['push', 'workflow_dispatch'].includes(run.event) && run.conclusion === 'success')) {
              throw new Error('Checks must succeed on this exact main commit before applying resources');
            }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_BOOTSTRAP_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" && test -n "$KNOWN"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/capacity
          chmod 600 ~/.ssh/capacity
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Apply reviewed capacity without restarting the render
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          ssh -i ~/.ssh/capacity -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "root@${HOST}" 'python3 -' < ops/export-worker-capacity.py
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/capacity
