name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    # Same base as the production image (Debian bookworm, its FFmpeg): CI must fail where production would.
    container: python:3.12-slim-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: lofi_test
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python -m py_compile ops/export-worker-capacity.py studio/render_resources.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx tsc --noEmit && npx vitest run && npx vite build
        working-directory: frontend
      # The deploy copies web/ as-is, so the committed bundle must match the source.
      - run: git diff --exit-code -- web/app
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests test_qc.py
        env:
          LOFI_TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@postgres:5432/lofi_test
      - run: node test_ui.cjs
      - run: node test_login.cjs
      - run: node test_studio_interface.cjs
      - run: node test_storyboard_state.cjs
      - run: node test_form_assistant.cjs
      - run: node test_timeline_assembly.cjs
      - run: for file in web/*.js; do node --check "$file"; done
