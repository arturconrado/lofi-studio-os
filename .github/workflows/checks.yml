name: Checks
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: lofi_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests test_qc.py
        env:
          LOFI_TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@127.0.0.1:5432/lofi_test
      - run: node test_ui.cjs
      - run: node test_login.cjs
      - run: node test_studio_interface.cjs
      - run: for file in web/*.js; do node --check "$file"; done
