name: Deploy
# Production deploy after the Checks workflow passes on main. The VPS key is bound to
# ops/auto-deploy.sh (forced command): it can deploy studio, creator and export-worker, nothing else.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Deploy (waits while production is busy)
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          sha=$(git rev-parse HEAD)
          bundle=$(mktemp -d)
          archive=$(mktemp)
          trap 'rm -rf "$bundle" "$archive"' EXIT
          git archive HEAD studio web requirements.txt | tar -x -C "$bundle"
          # The production base image stores requirements.txt with CRLF. Keep
          # the byte-level safety check in auto-deploy intact while normalizing
          # only line endings; real dependency changes still require a full build.
          python3 - "$bundle/requirements.txt" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          content = path.read_bytes().replace(b"\r\n", b"\n")
          path.write_bytes(content.replace(b"\n", b"\r\n"))
          PY
          tar -C "$bundle" -cf "$archive" studio web requirements.txt
          for attempt in 1 2 3 4 5 6 7; do
            set +e
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$HOST" "deploy $sha" < "$archive"
            code=$?
            set -e
            [ "$code" = 0 ] && exit 0
            [ "$code" = 75 ] || exit "$code"
            echo "Produção ocupada; nova tentativa em 5 minutos ($attempt/7)"
            sleep 300
          done
          echo "Produção continuou ocupada; rode o workflow Deploy manualmente depois." && exit 1
