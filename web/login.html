<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Lo-Fi Studio OS</title><link rel="stylesheet" href="/static/login.css"></head><body><main><section class="intro"><span class="brand">♫ Lo-Fi Studio OS</span><h1>Seu estúdio.<br>Seu ritmo.</h1><p>Produza Lo-Fi, organize sua biblioteca e acompanhe suas transmissões em um só lugar.</p><div class="visual" aria-hidden="true"><span>◒</span><i></i><i></i><i></i><i></i><i></i></div><small>Uma ideia de cada vez. Um estúdio sempre conectado.</small></section><section class="access"><div class="card"><p class="eyebrow">BEM-VINDO AO SEU ESTÚDIO</p><h2 id="title">Entrar</h2><p id="description">Continue de onde você parou.</p><form id="access-form"><label id="name-field" hidden>Nome do estúdio<input id="studio-name" autocomplete="organization" minlength="2" maxlength="100"></label><label id="email-field"><span id="email-label">E-mail</span><input id="email" type="email" autocomplete="username" required maxlength="254"></label><label id="password-field">Senha<input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><p class="hint" id="password-hint" hidden>Use pelo menos 12 caracteres.</p><button id="submit" type="submit">Entrar no estúdio</button></form><p id="feedback" role="status" aria-live="polite"></p><nav><button id="forgot" class="text-button">Esqueci minha senha</button><button id="register" class="text-button">Criar minha conta</button><button id="admin" class="text-button">Administração</button><button id="back" class="text-button" hidden>Voltar para entrar</button></nav><p class="hint" id="availability"></p></div></section></main><script src="/static/login.js"></script></body></html>
